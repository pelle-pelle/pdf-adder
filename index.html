<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDF Adder</title>

    <link rel="stylesheet" href="style.css">

    <!-- PDF編集ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>

<body>

    <main class="app">

        <header>
            <h1>PDF Adder</h1>
            <p>パンフレットPDFの先頭に広告ページを追加します</p>
        </header>


        <div id="serverWarning" class="warning hidden">
            このアプリはLive Serverから起動してください。
            index.htmlを直接ダブルクリックすると広告PDFを読み込めません。
        </div>


        <section id="dropArea" class="drop-area">

            <div class="drop-icon">PDF</div>

            <h2>ここにPDFをドラッグ＆ドロップ</h2>

            <p>または</p>

            <button
                id="selectButton"
                class="secondary-button"
                type="button"
            >
                PDFを選択
            </button>

            <input
                id="fileInput"
                type="file"
                accept=".pdf,application/pdf"
                multiple
                hidden
            >

        </section>


        <section
            id="fileSection"
            class="file-section hidden"
        >

            <div class="file-header">

                <div>
                    <h2>選択したPDF</h2>
                    <div id="fileCount"></div>
                </div>

                <button
                    id="clearButton"
                    class="text-button"
                    type="button"
                >
                    すべてクリア
                </button>

            </div>

            <ul id="fileList"></ul>

        </section>


        <section class="action-section">

            <button
                id="createButton"
                class="primary-button"
                type="button"
                disabled
            >
                広告付きPDFを作成
            </button>

            <div
                id="status"
                class="status"
            ></div>

        </section>


        <footer>
            <p>
                選択したPDFは外部サーバーへ送信されません。<br>
                PDF処理はブラウザ内で行われます。
            </p>
        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
